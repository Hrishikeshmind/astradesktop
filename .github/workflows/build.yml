name: Astra Release builds

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a new release for this build"
        required: false
        default: false
        type: "boolean"
      update_version:
        description: "Update the version number"
        required: false
        default: false
        type: "boolean"
      update_branch:
        description: "Update branch with new version"
        required: true
        default: "release"
        type: "choice"
        options:
          - "release"
          - "twilight"
      use-sccache:
        description: "Use sccache"
        required: true
        type: "boolean"
        default: false
      skip_macos:
        description: "Skip macOS / Darwin builds (Windows + Linux only)"
        required: false
        default: true
        type: "boolean"
  workflow_call:
    inputs:
      create_release:
        description: "Create a new release for this build"
        required: false
        default: false
        type: "boolean"
      update_version:
        description: "Update the version number"
        required: false
        default: false
        type: "boolean"
      update_branch:
        description: "Update branch with new version"
        required: true
        default: "release"
        type: "string"
      use-sccache:
        description: "Use sccache"
        required: true
        type: "boolean"
        default: false
      skip_macos:
        description: "Skip macOS / Darwin builds (Windows + Linux only)"
        required: false
        default: true
        type: "boolean"

jobs:
  # Fail in seconds on corrupt patch hunks. Do not wait for Firefox download,
  # npm ci, or the self-hosted runner. workflow_dispatch has no branch-protection
  # required-status-check against pr-test, so this job is the Release gate.
  validate-patches:
    name: Validate patch files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate patch hunks
        run: python3 scripts/validate_patches.py

  buildid:
    name: Generate build ID
    needs: [validate-patches]
    runs-on: ubuntu-latest
    outputs:
      buildids: ${{ steps.get.outputs.bid }}
      publish_paused: ${{ steps.pause.outputs.publish_paused }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pause blocks Pages publish, not the Windows/Linux build.
      # Exit 1 = live AUS still offers a <patch> while paused (unsafe).
      # Exit 2 = paused with empty AUS (safe to build; skip Pages commit).
      - name: Check publish pause / empty AUS
        id: pause
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_guard_update_publish.py \
            --brand "${{ inputs.update_branch }}" \
            --check-pause-only \
            --assert-empty-aus-while-paused
          rc=$?
          set -e
          if [[ "${rc}" -eq 0 ]]; then
            echo "publish_paused=false" >> "${GITHUB_OUTPUT}"
            echo "Publish is not paused"
            exit 0
          fi
          if [[ "${rc}" -eq 1 ]]; then
            echo "::error::Publish is paused but live AUS still offers an update. Refusing to start."
            exit 1
          fi
          echo "publish_paused=true" >> "${GITHUB_OUTPUT}"
          echo "::warning::Publish is paused. Windows/Linux will still build and can publish GitHub Release assets; Pages update.xml will not be committed."

      - id: get
        shell: bash -xe {0}
        run: |
          bdat=`date -u +"%Y%m%d%H%M%S"`
          echo "bid=${bdat}" >> $GITHUB_OUTPUT
          python3 scripts/assert_buildid_monotonic.py --new-buildid "${bdat}" \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/WINNT_x86_64-msvc-x64/${{ inputs.update_branch }}/update.xml" \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/Linux_x86_64-gcc3/${{ inputs.update_branch }}/update.xml"

      - name: Debug
        run: |
          echo "create_release: ${{ inputs.create_release }}"
          echo "update_version: ${{ inputs.update_version }}"
          echo "use sccache: ${{ inputs['use-sccache'] }}"
          echo "update_branch: ${{ inputs.update_branch }}"
          echo "skip_macos: ${{ inputs.skip_macos }}"
          echo "publish_paused: ${{ steps.pause.outputs.publish_paused }}"
          echo "GITHUB_REPOSITORY: ${{ github.repository }}"
          echo "GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}"

      - name: Check if correct branch
        if: ${{ inputs.create_release }}
        run: |
          echo "Checking if we are on the correct branch"
          git branch
          git status
          git branch --show-current
          branch="${{ inputs.update_branch }}"
          if [[ $branch == "twilight" ]]; then
            branch="dev"
          elif [[ $branch == "release" ]]; then
            branch="stable"
          fi
          if [[ $(git branch --show-current) != $branch ]]; then
            echo ">>> Branch mismatch"
          # exit 1
          else
            echo ">>> Branch matches"
          fi

  start-self-host:
    runs-on: ubuntu-latest
    needs: [validate-patches]
    steps:
      - name: Download aws-cli
        if: ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Start self-hosted runner
        if: ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          echo "Starting self-hosted runner"
          echo "${{ secrets.SELF_HOSTED_RUNNER_START_SCRIPT }}" | base64 -d > start.sh
          sudo chmod +x start.sh
          bash ./start.sh

      - name: Remove self-hosted runner script
        if: always() && ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          echo "Removing self-hosted runner script"
          rm start.sh || true

  build-data:
    permissions:
      contents: write
    name: Generate build data
    runs-on: ubuntu-latest
    needs: buildid
    outputs:
      build_date: ${{ steps.data.outputs.builddate }}
      version: ${{ steps.data.outputs.version }}
      build_time: ${{ steps.data.outputs.buildtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: |
          npm ci

      - name: Setup Surfer
        run: |
          npm i -g @zen-browser/surfer

      - name: Bump version
        if: ${{ inputs.update_branch == 'release' && (inputs.update_version || inputs.create_release) }}
        run: |
          npm run surfer -- ci --brand ${{ inputs.update_branch }} --bump prerelease

      - name: Bump version without new version
        if: ${{ inputs.update_branch == 'twilight' || !(inputs.update_version || inputs.create_release) }}
        run: |
          npm run surfer -- ci --brand ${{ inputs.update_branch }}

      - name: Debug
        run: |
          surfer get version
          surfer get version | xargs
          echo "$(surfer get version | xargs)"

      - name: Export release date
        id: data
        shell: bash
        run: |
          echo "builddate=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "version=$(surfer get version | xargs)" >> $GITHUB_OUTPUT
          echo "buildtime=$(date +"%H:%M:%S")" >> $GITHUB_OUTPUT

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ inputs.update_branch == 'release' && (inputs.update_version || inputs.create_release) }}
        with:
          commit_message: 🔖 Update version to ${{ steps.data.outputs.version }}
          commit_user_name: Astra Browser Robot
          commit_user_email: astra-browser-auto@users.noreply.github.com

  check-release:
    runs-on: ubuntu-latest
    needs: [build-data]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: |
          npm ci

      - name: Setup Surfer
        run: |
          npm i -g @zen-browser/surfer

      - name: Activate Surfer CLI
        run: |
          npm run surfer -- ci --brand ${{ inputs.update_branch }} --display-version ${{ needs.build-data.outputs.version }}

      - name: Check version
        run: |
          echo "$(pwd)"
          echo $(npm run --silent surfer -- get version | xargs)
          echo "version=$(npm run --silent surfer -- get version | xargs)" >> $GITHUB_OUTPUT
          if [[ $(npm run --silent surfer -- get version | xargs) == ${{ needs.build-data.outputs.version }} ]]; then
            echo ">>> Version matches"
          else
            echo ">>> Version mismatch"
            exit 1
          fi

  source:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-data, check-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci

      - name: Validate patch files
        run: npm run validate:patches

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand ${{ inputs.update_branch }} --display-version ${{ needs.build-data.outputs.version }}

      - name: Download Firefox source and dependencies
        run: npm run download --verbose

      - name: Validate patches apply to upstream
        run: npm run validate:apply

      - name: Import
        run: npm run import -- --verbose

      - name: Validate jar manifest paths
        run: python scripts/validate_jar_manifest.py

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Compress
        run: |
          tar \
            --exclude='./.git' \
            --use-compress-program=zstd \
            -hcf zen.source.tar.zst \
            -C engine .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: zen.source.tar.zst
          path: ./zen.source.tar.zst

  windows-step-1:
    name: Windows build (direct installer)
    uses: ./.github/workflows/windows-release-build.yml
    needs: [build-data, buildid]
    permissions:
      contents: write
    secrets: inherit
    with:
      use-sccache: ${{ inputs['use-sccache'] }}
      build-version: ${{ needs.build-data.outputs.version }}
      generate-gpo: false
      profile-data-path-archive: zen-windows-profile-data-and-jarlog.zip
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}

  windows-step-2:
    if: false
    name: Windows build step 2 (Generate profile data) [skipped]
    uses: ./.github/workflows/windows-profile-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [windows-step-1, build-data]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      profile-data-path-archive: zen.win64-pgo-stage-1.zip
      release-branch: ${{ inputs.update_branch }}

  windows-step-3:
    if: false
    name: Windows build step 3 (build with profile data) [skipped]
    uses: ./.github/workflows/windows-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, windows-step-2, start-self-host, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      generate-gpo: false
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs['use-sccache'] }}

  linux:
    name: Linux build
    uses: ./.github/workflows/linux-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, start-self-host, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs['use-sccache'] }}

  mac:
    if: ${{ !inputs.skip_macos }}
    name: macOS build
    uses: ./.github/workflows/macos-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, buildid]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}
      MOZ_BUILD_DATE: ${{needs.buildid.outputs.buildids}}
      use-sccache: ${{ inputs['use-sccache'] }}

  mac-uni:
    if: ${{ !inputs.skip_macos }}
    name: macOS build (Universal)
    uses: ./.github/workflows/macos-universal-release-build.yml
    permissions:
      contents: write
    secrets: inherit
    needs: [build-data, mac]
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      release-branch: ${{ inputs.update_branch }}

  appimage:
    name: AppImage build - Linux ${{ matrix.arch }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    needs: [linux, build-data]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get -y install libfuse2 desktop-file-utils appstream

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: astra.linux-${{ matrix.arch }}.tar.xz

      - name: Execute AppImage build
        run: |
          set -eux
          export ARCH=${{ matrix.arch }}
          UPINFO="gh-releases-zsync|$GITHUB_REPOSITORY_OWNER|astradesktop|latest|astra-$ARCH.AppImage.zsync"
          rm build/AppDir/.DirIcon || true
          cp configs/branding/${{ inputs.update_branch }}/logo128.png build/AppDir/usr/share/icons/hicolor/128x128/apps/zen.png
          cp configs/branding/${{ inputs.update_branch }}/logo128.png build/AppDir/zen.png && ln -s zen.png build/AppDir/.DirIcon

          if [ "${{ inputs.update_branch }}" = "twilight" ]; then
            sed -i -e 's/Name=Astra Browser/Name=Astra Nova/g' build/AppDir/zen.desktop
            sed -i -e 's/StartupWMClass=zen/StartupWMClass=zen-twilight/g' build/AppDir/zen.desktop
          fi

          sed -i -e 's/\$VERSION/${{ needs.build-data.outputs.version }}/g' build/AppDir/zen.desktop

          APPDIR=build/AppDir
          tar -xvf *.tar.* && rm -rf *.tar.*
          mv astra/* $APPDIR/ 2>/dev/null || mv zen/* $APPDIR/ 2>/dev/null || true
          mkdir -p "$APPDIR/distribution/extensions"
          curl -fsSL --retry 3 "https://github.com/gorhill/uBlock/releases/download/1.62.0/uBlock0_1.62.0.firefox.signed.xpi" \
            -o "$APPDIR/distribution/extensions/uBlock0@raymondhill.net.xpi"
          if [ -f "$APPDIR/distribution/extensions/uBlock0@raymondhill.net.xpi" ] && [ -s "$APPDIR/distribution/extensions/uBlock0@raymondhill.net.xpi" ]; then
            echo "uBlock XPI confirmed in AppImage"
            ls -la "$APPDIR/distribution/extensions/"
          else
            echo "::error::uBlock XPI MISSING from AppImage"
            exit 1
          fi
          cp build/AppDir/distribution/policies.json "$APPDIR/distribution/policies.json" 2>/dev/null || true
          if [ -f "$APPDIR/distribution/policies.json" ] && [ -s "$APPDIR/distribution/policies.json" ]; then
            echo "policies.json confirmed in AppImage:"
            cat "$APPDIR/distribution/policies.json"
          else
            echo "::error::policies.json MISSING from AppImage"
            exit 1
          fi
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          wget "https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-squashfs-lite-$ARCH"
          chmod +x *.AppImage
          chmod +x ./uruntime-appimage-squashfs-lite-"$ARCH"
          chmod +x ./build/AppDir/AppRun

          # keep the uruntime mountpoint (massively speeds up launch time)
          sed -i 's|URUNTIME_MOUNT=[0-9]|URUNTIME_MOUNT=0|' ./uruntime-appimage-squashfs-lite-"$ARCH"

          echo "AppDir: $APPDIR"
          ls -al
          find .
          ls -al "$APPDIR"
          ./appimagetool-x86_64.AppImage -u "$UPINFO" "$APPDIR" astra-"$ARCH".AppImage --runtime-file ./uruntime-appimage-squashfs-lite-"$ARCH"
          mkdir dist
          mv astra*AppImage* dist/.
          unset ARCH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: astra-${{ matrix.arch }}.AppImage
          path: ./dist/astra-${{ matrix.arch }}.AppImage
          if-no-files-found: warn

      - name: Upload artifact (ZSync)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: astra-${{ matrix.arch }}.AppImage.zsync
          path: ./dist/astra-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: warn

  stop-self-hosted:
    runs-on: ubuntu-latest
    needs: [windows-step-1, linux]
    if: always()
    steps:
      - name: Download aws-cli
        if: ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Stop self-hosted runner
        if: ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          echo "Stopping self-hosted runner"
          echo "${{ secrets.SELF_HOSTED_RUNNER_STOP_SCRIPT }}" | base64 -d > stop.sh
          sudo chmod +x stop.sh
          bash ./stop.sh > /dev/null

      - name: Remove self-hosted runner script
        if: always() && ${{ inputs.create_release && inputs.update_branch == 'release' }}
        run: |
          echo "Removing self-hosted runner script"
          rm stop.sh || true

  release:
    if: >-
      ${{ always()
          && !cancelled()
          && (inputs.create_release || inputs.update_branch == 'twilight')
          && needs.build-data.result == 'success'
          && needs.linux.result == 'success'
          && needs.windows-step-1.result == 'success'
          && needs.check-release.result == 'success'
          && needs.source.result == 'success'
          && (needs.appimage.result == 'success' || needs.appimage.result == 'skipped')
          && (needs.stop-self-hosted.result == 'success' || needs.stop-self-hosted.result == 'skipped' || needs.stop-self-hosted.result == 'failure')
      }}
    permissions: write-all
    name: Release
    needs:
      [
        buildid,
        build-data,
        linux,
        windows-step-1,
        check-release,
        mac-uni,
        appimage,
        source,
        stop-self-hosted,
      ]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.update_branch == 'release' && 'Deploy-Release' || 'Deploy-Twilight' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Sign MARs
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
          ZEN_SIGNING_CERT_PEM_BASE64: ${{ secrets.ZEN_SIGNING_CERT_PEM_BASE64 }}
          ZEN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.ZEN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
          ZEN_MAR_SIGNING_PASSWORD: ${{ secrets.ZEN_MAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ZEN_SIGNING_PRIVATE_KEY_PEM_BASE64:-}" ]]; then
            echo "::error::ZEN_SIGNING_PRIVATE_KEY_PEM_BASE64 secret is missing."
            echo "Shipped updater.exe is built with MOZ_VERIFY_MAR_SIGNATURE and rejects unsigned MARs (CERT_VERIFY_ERROR 19 / 'There must be at least one signature')."
            echo "Add the primary private key that matches build/signing/release_primary.der (CN=Astra MAR Signing Primary)."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y openssl
          # Signing and verification are OpenSSL RSA-PKCS1-SHA384
          # (scripts/mar_sign_openssl.py). Do not pick Windows signmar.exe from
          # artifacts — that binary is not executable on the Ubuntu runner and
          # run #134 failed there with exit 126 after OpenSSL had already signed.
          bash scripts/mar_sign.sh -s
          bash scripts/mar_verify.sh

      - name: Checkout updates repository
        uses: actions/checkout@v4
        with:
          repository: Hrishikeshmind/astradesktop
          ref: updates
          path: updates-server
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Guard MAR channel, buildID monotonicity, and pause switch
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
          SKIP_MACOS: ${{ inputs.skip_macos }}
          PUBLISH_PAUSED: ${{ needs.buildid.outputs.publish_paused }}
        run: |
          set -euo pipefail
          NEW_BUILDID="${{ needs.buildid.outputs.buildids }}"
          search_args=(
            --search windows.mar
            --search windows-arm64.mar
            --search linux.mar
            --search linux-aarch64.mar
            --search .
          )
          if [[ "${SKIP_MACOS}" != "true" ]]; then
            search_args+=(--search macos.mar)
          fi
          extra_args=()
          # Pause must not block GitHub Release asset publish. It only blocks
          # the later Pages commit. Still verify MAR channel + signatures.
          if [[ "${PUBLISH_PAUSED}" == "true" ]]; then
            extra_args+=(--allow-paused-override)
            echo "::warning::Publish paused: MAR/XML will be validated and GitHub Release assets uploaded, but Pages update.xml will not be committed."
          fi
          python3 scripts/ci_guard_update_publish.py \
            --brand "${RELEASE_BRANCH}" \
            --new-buildid "${NEW_BUILDID}" \
            --require-mars \
            "${search_args[@]}" \
            ${extra_args[@]+"${extra_args[@]}"} \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/WINNT_x86_64-msvc-x64/${RELEASE_BRANCH}/update.xml" \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/WINNT_x86_64-msvc/${RELEASE_BRANCH}/update.xml" \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/Linux_x86_64-gcc3/${RELEASE_BRANCH}/update.xml" \
            --live-xml "https://hrishikeshmind.github.io/astradesktop/updates/browser/Linux_aarch64-gcc3/${RELEASE_BRANCH}/update.xml"

      - name: Copy update manifests
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
        run: |
          set -euo pipefail
          cd updates-server
          mkdir -p updates

          # Required Linux + Windows manifests (built locally for both channels).
          # Do not depend on zen-browser/windows-binaries.
          for dir in \
            ../linux_update_manifest_x86_64 \
            ../linux_update_manifest_aarch64 \
            ../windows_update_manifest_x86_64 \
            ../windows_update_manifest_arm64
          do
            if [[ ! -d "$dir" ]]; then
              echo "::error::Missing update manifest artifact directory: $dir"
              ls -la .. || true
              exit 1
            fi
            cp -a "$dir"/. updates/
          done

          # Darwin update.xml is never published from this path when skip_macos
          # is set (default). Do not copy leftover macOS artifacts onto Pages.
          if [[ "${{ inputs.skip_macos }}" != "true" && -d ../macos_update_manifest ]]; then
            cp -a ../macos_update_manifest/. updates/
          else
            echo "Skipping Darwin update.xml (skip_macos=${{ inputs.skip_macos }})"
          fi

          echo "=== ${RELEASE_BRANCH} update.xml files ==="
          mapfile -t channel_xmls < <(find updates/browser -type f \( -path "*/WINNT_*/${RELEASE_BRANCH}/update.xml" -o -path "*/Linux_*/${RELEASE_BRANCH}/update.xml" \) | sort)
          if [[ ${#channel_xmls[@]} -eq 0 ]]; then
            echo "::error::No Linux/Windows update.xml files found for channel '${RELEASE_BRANCH}'"
            find updates -type f -name 'update.xml' -print | sort || true
            exit 1
          fi
          empty=0
          windows_ok=0
          for f in "${channel_xmls[@]}"; do
            if ! grep -q '<patch ' "$f"; then
              echo "::error::Empty or stub update manifest: $f"
              cat "$f" || true
              empty=1
            else
              echo "OK non-empty: $f ($(wc -c < "$f") bytes)"
              if [[ "$f" == *"/WINNT_"* ]]; then
                windows_ok=1
              fi
            fi
          done
          if [[ "$empty" -ne 0 ]]; then
            echo "One or more ${RELEASE_BRANCH} Linux/Windows update.xml files are empty stubs; refusing to publish."
            exit 1
          fi
          if [[ "$windows_ok" -eq 0 ]]; then
            echo "::error::No non-empty Windows (WINNT_*) update.xml published for '${RELEASE_BRANCH}'"
            exit 1
          fi

      - name: Point patch URLs at GitHub Release MAR assets
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
          RELEASE_VERSION: ${{ needs.build-data.outputs.version }}
        run: |
          set -euo pipefail
          # Asset URLs are deterministic from tag + filename; the GitHub Release
          # does not need to exist yet. Never leave <patch URL> as the generic
          # github.com/<repo>/releases page (that is detailsURL, not the MAR).
          TAG="${RELEASE_VERSION}"
          if [[ "${RELEASE_BRANCH}" == "twilight" ]]; then
            TAG="twilight-1"
          fi
          extra=()
          if [[ "${{ inputs.skip_macos }}" == "true" ]]; then
            extra+=(--skip-darwin)
          fi
          python3 scripts/rewrite_update_xml_patch_urls.py \
            --xml-root updates-server/updates \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --channel "${RELEASE_BRANCH}" \
            ${extra[@]+"${extra[@]}"}

      - name: Validate staged update.xml against signed MARs
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
        run: |
          set -euo pipefail
          NEW_BUILDID="${{ needs.buildid.outputs.buildids }}"
          # Hash/size in update.xml must match the *signed* MAR on disk.
          # Catches XML generated before signing (false hash → endless download fail).
          args=(
            --brand "${RELEASE_BRANCH}"
            --expected-buildid "${NEW_BUILDID}"
            --xml-root updates-server/updates
            --require-win-linux
          )
          pairs=(
            "windows.mar=windows.mar"
            "windows-arm64.mar=windows-arm64.mar"
            "linux.mar=linux.mar"
            "linux-aarch64.mar=linux-aarch64.mar"
          )
          if [[ "${{ inputs.skip_macos }}" != "true" ]]; then
            pairs+=("macos.mar=macos.mar")
          fi
          for pair in "${pairs[@]}"
          do
            name="${pair%%=*}"
            # Artifacts land as either a file or a directory named after the artifact.
            if [[ -f "./${name}" ]]; then
              args+=(--mar "${name}=./${name}")
            elif [[ -f "./${name}/${name}" ]]; then
              args+=(--mar "${name}=./${name}/${name}")
            elif [[ -d "./${name}" ]]; then
              found="$(find "./${name}" -type f -name '*.mar' | head -1 || true)"
              if [[ -n "${found}" ]]; then
                args+=(--mar "${name}=${found}")
              fi
            fi
          done
          python3 scripts/validate_update_xml.py "${args[@]}"

      - name: Generate Release Notes
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
          RELEASE_VERSION: ${{ needs.build-data.outputs.version }}
          SKIP_MACOS: ${{ inputs.skip_macos }}
        run: bash .github/workflows/src/generate_release_notes.sh

        # Publish GitHub Release *assets* before Pages update.xml.
        # Clients resolve MAR URLs from AUS; offering XML that points at a
        # not-yet-uploaded asset causes download failures / false loops.
      - name: Update Twilight tag
        if: ${{ inputs.update_branch == 'twilight' }}
        uses: softprops/action-gh-release@v2.2.2
        with:
          body_path: release_notes.md
          files: |
            ./zen.source.tar.zst/*
            ./astra.linux-x86_64.tar.xz/*
            ./astra.linux-aarch64.tar.xz/*
            ./astra-x86_64.AppImage/*
            ./astra-x86_64.AppImage.zsync/*
            ./astra-aarch64.AppImage/*
            ./astra-aarch64.AppImage.zsync/*
            ./astra.win-x86_64.zip/*
            ./astra.win-arm64.zip/*
            ./linux.mar/*
            ./linux-aarch64.mar/*
            ./windows.mar/*
            ./windows-arm64.mar/*
            ./macos.mar/*
            ./astra.installer.exe/*
            ./astra.installer-arm64.exe/*
            ./zen.macos-universal.dmg/*
          tag_name: "twilight-1"
          name: "Twilight build - ${{ needs.build-data.outputs.version }} (${{ needs.build-data.outputs.build_date }} at ${{ needs.build-data.outputs.build_time }})"
          draft: false
          generate_release_notes: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Release
        uses: softprops/action-gh-release@v2.2.2
        if: ${{ inputs.update_branch == 'release' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build-data.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: false
          name: "Release build - ${{ needs.build-data.outputs.version }} (${{ needs.build-data.outputs.build_date }})"
          body_path: release_notes.md
          files: |
            ./zen.source.tar.zst/*
            ./astra.linux-x86_64.tar.xz/*
            ./astra.linux-aarch64.tar.xz/*
            ./astra-x86_64.AppImage/*
            ./astra-x86_64.AppImage.zsync/*
            ./astra-aarch64.AppImage/*
            ./astra-aarch64.AppImage.zsync/*
            ./astra.win-x86_64.zip/*
            ./astra.win-arm64.zip/*
            ./astra.installer.exe/*
            ./astra.installer-arm64.exe/*
            ./linux.mar/*
            ./linux-aarch64.mar/*
            ./windows.mar/*
            ./windows-arm64.mar/*
            ./macos.mar/*
            ./zen.macos-universal.dmg/*

      - name: Assert release MAR URLs are fetchable
        env:
          RELEASE_BRANCH: ${{ inputs.update_branch }}
          RELEASE_VERSION: ${{ needs.build-data.outputs.version }}
        run: |
          set -euo pipefail
          # Probe every MAR URL referenced by staged XML before flipping Pages.
          mapfile -t urls < <(
            grep -RhoE 'URL="https://[^"]+\.mar"' updates-server/updates/browser \
              | sed -E 's/^URL="//; s/"$//' \
              | sort -u
          )
          if [[ ${#urls[@]} -eq 0 ]]; then
            echo "::error::No MAR URLs found in staged update.xml"
            exit 1
          fi
          fail=0
          for url in "${urls[@]}"; do
            echo "HEAD ${url}"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -L --head "${url}" || true)"
              if [[ "${code}" == "200" ]]; then
                ok=1
                break
              fi
              echo "  attempt ${attempt}: HTTP ${code}; waiting for GitHub CDN..."
              sleep 10
            done
            if [[ "${ok}" -ne 1 ]]; then
              echo "::error::MAR not reachable after retries: ${url}"
              fail=1
            else
              echo "  OK ${url}"
            fi
          done
          if [[ "${fail}" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload staged update manifests (for later Pages publish)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: staged-update-manifests
          path: updates-server/updates
          if-no-files-found: error

      - name: Commit Pages update.xml (after MARs are live)
        if: ${{ needs.buildid.outputs.publish_paused != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🚀 Update update manifests
          commit_user_name: Astra Browser Robot
          commit_user_email: astra-browser-auto@users.noreply.github.com
          repository: ./updates-server
          branch: updates
          file_pattern: updates/**

      - name: Skip Pages commit while publish is paused
        if: ${{ needs.buildid.outputs.publish_paused == 'true' }}
        run: |
          echo "::warning::Publish paused: GitHub Release assets were uploaded, but live AUS stays empty <updates/>. After Win/Linux verification, set paused=0 and publish the staged-update-manifests artifact to the updates branch."

  post-publish-header-check:
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    name: Post-publish MAR header check
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert live Pages MAR channel + signature
        run: python3 scripts/post_publish_mar_header_check.py --brand "${{ inputs.update_branch }}"
        # Script retries live Pages XML 6×10s with a cache-buster. GitHub Pages
        # typically needs ~20s to rebuild after the updates-branch commit; a
        # single fetch immediately after "Commit Pages update.xml" races that.

  prepare-flatpak:
    if: ${{ false }}
    permissions: write-all
    name: Prepare Flatpak
    needs: [release, linux, build-data]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: zen-browser/release-utils
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          git pull
          sudo apt-get update
          npm ci

      - name: Generate new Flatpak release
        run: |
          npm run build-flatpak -- \
            --version ${{ needs.build-data.outputs.version }}

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🚀 Update releases for Flatpak
          commit_user_name: Astra Browser Robot
          commit_user_email: astra-browser-auto@users.noreply.github.com

      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: zen-browser/flatpak
          token: ${{ secrets.GITHUB_TOKEN }}
          path: flatpak

      - name: Move releases.xml
        run: |
          pwd
          ls .
          ls ..
          mv releases.xml ./flatpak/app.zen_browser.zen.metainfo.xml
          # output the version to the file
          echo -n ${{ needs.build-data.outputs.version }} > ./flatpak/version

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[release]: Update Flatpak manifest"
          commit_user_name: Astra Browser Robot
          commit_user_email: astra-browser-auto@users.noreply.github.com
          repository: ./flatpak

      - name: Wait 2 minutes for the Flatpak repo to update
        run: sleep 120

  release-flatpak:
    if: ${{ false }}
    permissions: write-all
    name: Release Flatpak
    needs: [prepare-flatpak, build-data]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flatpak repository
        uses: actions/checkout@v4
        with:
          repository: flathub/app.zen_browser.zen
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: astra.linux-x86_64.tar.xz

      - name: Download Linux aarch64 build
        uses: actions/download-artifact@v4
        with:
          name: astra.linux-aarch64.tar.xz

      - name: Update repository
        uses: actions/checkout@v4
        with:
          path: zen-browser
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Flatpak archive
        run: |
          wget https://github.com/zen-browser/flatpak/releases/latest/download/archive.tar -O archive.tar

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Flatpak manifest
        run: |
          python3 ./zen-browser/scripts/prepare-flatpak-release.py \
            --flatpak-archive archive.tar \
            --version ${{ needs.build-data.outputs.version }} \
            --linux-archive astra.linux-x86_64.tar.xz \
            --linux-aarch64-archive astra.linux-aarch64.tar.xz \
            --output app.zen_browser.zen.yml \
            --template-root ./zen-browser/build/flatpak

      - name: Commit changes
        run: |
          git add app.zen_browser.zen.yml
          git commit -m "Update to version ${{ needs.build-data.outputs.version }}"

      - name: Clean up
        run: |
          rm -rf zen-browser
          rm -rf archive.tar
          rm -rf astra.linux-x86_64.tar.xz
          rm -rf astra.linux-aarch64.tar.xz

      - name: Upload Flatpak manifest
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: app.zen_browser.zen.yml
          path: ./app.zen_browser.zen.yml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        env:
          GIT_TRACE: 1
          GIT_CURL_VERBOSE: 1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update to version `${{ needs.build-data.outputs.version }}`
          title: Update to version `${{ needs.build-data.outputs.version }}`
          body: |
            This PR updates the Astra Browser Flatpak package to version ${{ needs.build-data.outputs.version }}.

            @${{ github.actor }} please review and merge this PR.
          branch: update-to-${{ needs.build-data.outputs.version }}
          base: master
          git-token: ${{ secrets.GITHUB_TOKEN }}
          delete-branch: true
