# Astra feature toggle: Zen Spaces/Workspaces UI (single-space mode).
# Disabled by default: the workspaces engine keeps running with the default
# space (tab strip, session restore, and pinning depend on it), but all
# Spaces UI is hidden and space creation is a no-op. Flip to true to fully
# restore Spaces — no engine code is modified.
- name: astra.feature.spaces.enabled
  value: false

- name: zen.workspaces.continue-where-left-off
  value: false

- name: zen.workspaces.hide-default-container-indicator
  value: true

- name: zen.workspaces.force-container-workspace
  value: false

- name: zen.workspaces.open-new-tab-if-last-unpinned-tab-is-closed
  value: true

- name: zen.workspaces.swipe-actions
  value: true

# Milliseconds. Used by Space switch animation (getIntPref; must exist as int).
- name: zen.workspaces.switch-animation-duration
  value: 200

- name: zen.workspaces.wrap-around-navigation
  value: true

- name: zen.workspaces.natural-scroll
  value: false

- name: zen.workspaces.scroll-modifier-key
  value: ctrl

- name: services.sync.engine.workspaces
  value: true

- name: zen.workspaces.separate-essentials
  value: true

- name: zen.workspaces.dnd-switch-padding
  value: 5

- name: zen.workspaces.debug
  value: "@cond"
  condition: "!defined(MOZILLA_OFFICIAL)" # Section: Pinned tabs management

- name: zen.pinned-tab-manager.wheel-close-if-pending
  value: true

- name: zen.pinned-tab-manager.debug
  value: false

- name: zen.pinned-tab-manager.restore-pinned-tabs-to-pinned-url
  value: false

- name: zen.pinned-tab-manager.close-shortcut-behavior
  value: reset-unload-switch

- name: zen.tab-unloader.auto-unload-inactive
  value: true

# Inactive background tabs (including the active space — Spaces is off by
# default). 8 minutes is short enough for 8GB laptops without surprising
# people who bounce between a few sites.
- name: zen.tab-unloader.timeout-minutes
  value: 8

- name: zen.tab-unloader.aggressiveness
  value: balanced

# Start the high-pressure path inside a typical 10–30 tab Indian session,
# not after 50 tabs when the machine is already swapping.
- name: zen.tab-unloader.high-tab-threshold
  value: 22

# Small batches: remaining tabs are picked up by the 60s scheduler.
- name: zen.tab-unloader.max-batch
  value: 8

- name: zen.performance.measure-workspaces
  value: false
