# Astra: Replace Mozilla SUMO/support URLs with project help infrastructure.
- name: app.support.baseURL
  value: "https://github.com/Hrishikeshmind/astradesktop/issues/new?labels=bug&title="

# Share ideas / feedback menu (Discussions not enabled on the repo yet).
- name: app.feedback.baseURL
  value: "https://github.com/Hrishikeshmind/astradesktop/issues/new?labels=enhancement&title="

# detectportal.firefox.com is kept intentionally: it is Mozilla-operated
# connectivity-check infrastructure with no user-visible branding. Replacing
# it would require Astra-hosted captive-portal detection endpoints.
#
# Do NOT override captivedetect.canonicalContent. This Firefox tree still
# uses captivedetect.canonicalURL = .../canonical.html, whose body is the
# support.mozilla.org meta-refresh string in all.js/greprefs.js. An empty
# expected body (correct for generate_204, bug 2052715) makes every 200
# response look like a captive portal and permanently LOCKED_PORTAL.
